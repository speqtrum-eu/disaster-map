name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.10"

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install black isort flake8 mypy ruff
      
      - name: Check formatting (black)
        run: black --check src tests
      
      - name: Check imports (isort)
        run: isort --check-only src tests
      
      - name: Run linter (flake8)
        run: flake8 src tests --max-line-length=100
      
      - name: Type checking (mypy)
        run: mypy src --ignore-missing-imports
      
      - name: Code quality (ruff)
        run: ruff check src tests

  test:
    name: Testing
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout
      
      - name: Run unit tests
        run: |
          pytest tests/unit --cov=src --cov-report=xml --cov-report=term-missing
          
      - name: Run integration tests
        run: |
          pytest tests/integration --timeout=300 --cov-append
      
      - name: Run e2e tests
        run: |
          pytest tests/e2e --timeout=600 --cov-append
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run SLAM benchmarks
        run: |
          python scripts/benchmark-slam.py --iterations 100 || true
      
      - name: Run latency benchmarks
        run: |
          python scripts/benchmark-latency.py --iterations 20 || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: pip install bandit safety
      
      - name: Run Bandit security scan
        run: bandit -r src tests --format json -o bandit-report.json
      
      - name: Check for unsafe packages (safety)
        run: safety check -r requirements.txt

  deploy:
    name: Deploy to Staging
    needs: [test, benchmark]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t disaster-map:${{ github.sha }} ./docker
      
      - name: Push to registry
        run: |
          echo "Deploying disaster-map v${{ github.sha }}"
