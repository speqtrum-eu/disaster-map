# CI/CD Pipeline Configuration
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'

jobs:
  # ====================
  # Lint & Code Quality
  # ====================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 isort black mypy ruff
      
      - name: Check formatting (Black)
        run: black --check src/ tests/ || true
      
      - name: Check imports (isort)
        run: isort --check-only src/ tests/ || true
      
      - name: Run linter (flake8)
        run: flake8 src/ tests/ --max-line-length=100
      
      - name: Type checking (mypy)
        run: mypy src/ --ignore-missing-imports
      
      - name: Code style check (ruff)
        run: ruff check src/ tests/

  # ====================
  # Unit Tests
  # ====================
  test-unit:
    name: Unit Tests with Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio coverage
      
      - name: Run unit tests
        run: |
          pytest tests/unit \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v
      
      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ====================
  # Integration Tests
  # ====================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio psycopg2-binary redis
      
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/integration \
            --timeout=120 \
            -v \
            --tb=short

  # ====================
  # Performance Benchmark
  # ====================
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest psutil numpy
      
      - name: Run performance benchmark
        run: |
          # Generate test data if needed
          python scripts/generate-demo-data.py --frames 1000 || true
          
          # Run SLAM performance benchmark
          python scripts/benchmark-slam.py \
            tests/fixtures/sample_video.mp4 \
            --output results/benchmark.json \
            --min-fps 30 \
            --max-latency-ms 50
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: results/

  # ====================
  # Security Scan
  # ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # ====================
  # Build Docker Image
  # ====================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    needs: [lint, test-unit, test-integration]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Docker image
        run: |
          docker build \
            --tag disaster-map:${{ github.sha }} \
            --tag disaster-map:latest \
            ./docker
      
      - name: Save Docker image
        uses: actions/upload-artifact@v3
        with:
          name: disaster-map-image
          path: |
            $(docker create disaster-map:${{ github.sha }})/
            !*.pyc

  # ====================
  # Deploy to Staging
  # ====================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    
    needs: [build-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to staging environment
        run: |
          echo "Deploying disaster-map v${{ github.sha }} to staging"
          # Add your deployment commands here
          # Example: kubectl set image deployment/disaster-map backend=disaster-map:${{ github.sha }}
      
      - name: Verify deployment
        run: |
          echo "Verifying staging deployment..."
          # Add verification steps here

  # ====================
  # Deploy to Production
  # ====================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    needs: [build-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to production environment
        run: |
          echo "Deploying disaster-map v${{ github.sha }} to production"
          # Add your deployment commands here
          # Example: kubectl set image deployment/disaster-map backend=disaster-map:${{ github.sha }}
      
      - name: Verify deployment
        run: |
          echo "Verifying production deployment..."
          # Add verification steps here

  # ====================
  # Notify on Failure
  # ====================
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    
    needs: [lint, test-unit, test-integration, benchmark]
    if: failure()
    
    steps:
      - name: Send notification
        run: |
          echo "CI/CD pipeline failed. Notifying team..."
          # Add your notification logic here
          # Example: curl -X POST $SLACK_WEBHOOK_URL -d '{"text": "CI/CD Pipeline Failed"}'