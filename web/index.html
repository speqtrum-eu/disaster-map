<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disaster Map Viewer - CesiumJS 3D Visualization</title>
  
  <!-- CesiumJS CDN -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  
  <!-- Three.js for advanced rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- PLY parser for point cloud data -->
  <script src="https://cdn.jsdelivr.net/npm/ply-parser@1.1.0/dist/ply-parser.min.js"></script>
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100%;
    }

    /* Loading screen */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #0a0a15;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid #1a1a2e;
      border-top-color: #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      position: absolute;
      bottom: 20px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loadingScreen" class="loading-screen">
    <div class="loading-spinner"></div>
    <p class="loading-text">Loading Disaster Map Viewer...</p>
  </div>

  <!-- Root Container -->
  <div id="root"></div>

  <!-- React and Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Main Application -->
  <script type="text/babel">
    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', function() {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      
      // Import the App component dynamically
      import('./App.jsx').then(module => {
        const App = module.default;
        
        // Hide loading screen after a short delay
        setTimeout(() => {
          document.getElementById('loadingScreen').style.display = 'none';
        }, 1000);
        
        root.render(<App />);
      }).catch(error => {
        console.error('Failed to load App:', error);
        document.getElementById('loadingScreen').innerHTML = `
          <div style="text-align: center; color: #e74c3c;">
            <i class="fas fa-exclamation-triangle" style="font-size: 48px;"></i>
            <p style="margin-top: 10px;">Error loading application</p>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
